# ─────────────────────────────────────────────
# CrashGuard AI — Docker Compose
# ─────────────────────────────────────────────
# Usage:
#   cp .env.example .env   # fill in credentials
#   docker-compose up       # http://localhost:5000
# ─────────────────────────────────────────────

services:
  crashguard:
    build: .
    container_name: crashguard-ai
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - DEMO_MODE=${DEMO_MODE:-1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
